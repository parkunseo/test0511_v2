<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNKIN' ODD OBJECTS CULT</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,600;1,900&family=Montserrat:wght@300;500;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dnk-pink: #E11A80;
            --dnk-orange: #FF671F;
            --dnk-cream: #FDFBF7;
            --dnk-brown: #2B1A11;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dnk-cream); 
            color: var(--dnk-brown); 
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
        }

        .window-wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER */
        header {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--dnk-brown);
            z-index: 1000;
        }

        header .brand-logo a {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.6em;
            color: var(--dnk-brown);
            text-decoration: none;
            letter-spacing: -1px;
            transition: color 0.3s;
        }

        header .brand-logo a:hover {
            color: var(--dnk-pink);
        }

        header ul {
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            font-weight: 500;
            color: var(--dnk-brown);
            margin-left: 50px;
            text-decoration: none;
            letter-spacing: 1px;
            position: relative;
        }

        header ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--dnk-orange);
            transition: width 0.3s ease;
        }

        header ul li a:hover::after {
            width: 100%;
        }

        /* SHOWCASE CONTAINER */
        .showcase-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 60px;
            display: flex;
            align-items: stretch;
            flex: 1;
        }

        .text-side {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 40px;
            border-right: 1px solid rgba(43, 26, 17, 0.15);
        }

        .text-side .collection-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--dnk-pink) 0%, var(--dnk-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .text-side h1 {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: min(4.2vw, 3.8em); 
            line-height: 1.1em;
            font-weight: 900;
            color: var(--dnk-brown);
            white-space: pre-line; /* 자바스크립트의 \n 줄바꿈 인식 고도화 */
        }

        .text-side p {
            font-size: 0.95em;
            font-weight: 400;
            line-height: 1.8em;
            color: rgba(43, 26, 17, 0.7);
            margin-top: 30px;
            word-break: keep-all;
            max-width: 480px;
        }

        .text-side .archive-btn {
            display: inline-block;
            align-self: flex-start;
            margin-top: 40px;
            padding: 16px 40px;
            background: var(--dnk-brown);
            color: var(--dnk-cream);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8em;
            font-weight: 500;
            letter-spacing: 2px;
            text-decoration: none;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .text-side .archive-btn:hover {
            background: linear-gradient(135deg, var(--dnk-pink) 0%, var(--dnk-orange) 100%);
            transform: translateX(5px);
        }

        /* VISUAL SIDE */
        .visual-side {
            width: 55%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .visual-side .bg-giant-text {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-size: 11em;
            font-weight: 800;
            color: rgba(43, 26, 17, 0.04);
            letter-spacing: -5px;
            user-select: none;
            z-index: 1;
            white-space: nowrap;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
        }

        .object-frame {
            width: 420px;
            height: 480px;
            border: 1px solid var(--dnk-brown);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            background-color: transparent;
        }

        .object-frame::before {
            content: '+';
            position: absolute;
            top: 10px;
            left: 14px;
            font-family: 'Montserrat', sans-serif;
            color: var(--dnk-brown);
            font-size: 1.2em;
        }

        .visual-side img.main-object {
            max-width: 75%;
            height: auto;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease; /* 트랜지션 텐션 강화 */
        }

        /* FOOTER NAVIGATION */
        .footer-navigation {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            border-top: 2px solid var(--dnk-brown);
            z-index: 1000;
        }

        .footer-navigation .nav-cell {
            padding: 30px 40px;
            border-right: 1px solid rgba(43, 26, 17, 0.15);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-top: 4px solid transparent; /* 기본 공간 확보로 덜컹거림 방지 */
        }

        .footer-navigation .nav-cell:last-child {
            border-right: none;
        }

        .footer-navigation .nav-cell .meta-info {
            display: flex;
            flex-direction: column;
        }

        .footer-navigation .nav-cell .meta-info .index-num {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75em;
            color: rgba(43, 26, 17, 0.4);
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .footer-navigation .nav-cell .meta-info .object-title {
            font-size: 1.05em;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--dnk-brown);
        }

        .footer-navigation .nav-cell .preview-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(43, 26, 17, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            transition: transform 0.4s ease;
        }

        .footer-navigation .nav-cell .preview-circle img {
            width: 80%;
            height: auto;
        }

        .footer-navigation .nav-cell:hover .preview-circle {
            transform: rotate(45deg) scale(1.1);
        }

        /* ACTIVE STATES (Cleaned up !important) */
        .footer-navigation .nav-cell.active-01 {
            background-color: rgba(255, 103, 31, 0.06);
            border-top-color: var(--dnk-orange);
        }
        .footer-navigation .nav-cell.active-01 .index-num { color: var(--dnk-orange); }

        不可 .footer-navigation .nav-cell.active-02 {
            background-color: rgba(225, 26, 128, 0.06);
            border-top-color: var(--dnk-pink);
        }
        .footer-navigation .nav-cell.active-02 .index-num { color: var(--dnk-pink); }
       
        .footer-navigation .nav-cell.active-03 {
            background-color: rgba(43, 26, 17, 0.06); 
            border-top-color: var(--dnk-brown);
        }
        .footer-navigation .nav-cell.active-03 .index-num { color: var(--dnk-brown); }
    </style>
</head>
<body>

    <div class="window-wrapper">
        
        <header>
            <div class="brand-logo"><a href="#">DUNKIN' OBJECTS</a></div>
            <ul>
                <li><a href="#">COLLECTION</a></li>
                <li><a href="#">LAB STORE</a></li>
                <li><a href="#">OUR VISION</a></li>
            </ul>
        </header>

        <div class="showcase-container">
            
            <div class="text-side">
                <div class="collection-name" id="target-meta">CULT OBJECT . 01</div>
                <h1 id="target-title">Famous<br>Original Glazed</h1>
                <p id="target-desc">지정된 단맛의 규칙을 파괴하다. 던킨의 시그니처 텍스처를 크림 아카이브 감성으로 미니멀하게 정제해 낸 프리미엄 에디션 오브제.</p>
                <a href="#" class="archive-btn">VIEW DETAILS</a>
            </div>

            <div class="visual-side">
                <div class="bg-giant-text" id="target-bg-text">GLAZED</div>
                
                <div class="object-frame">
                    <img src="./imgs/donut1.png" alt="Dunkin Core Object" class="main-object" id="target-img">
                </div>
            </div>

        </div>

        <div class="footer-navigation">
            <div class="nav-cell active-01" id="cell-1" onclick="switchExhibit('CULT OBJECT . 01', 'Famous\nOriginal Glazed', '지정된 단맛의 규칙을 파괴하다. 던킨의 시그니처 텍스처를 크림 아카이브 감성으로 미니멀하게 정제해 낸 프리미엄 에디션 오브제.', 'GLAZED', './imgs/donut1.png', 1, this)">
                <div class="meta-info">
                    <span class="index-num">01 / ORANGE SHADE</span>
                    <span class="object-title">FAMOUS GLAZED</span>
                </div>
                <div class="preview-circle">
                    <img src="./imgs/thumb1.png" alt="thumb1">
                </div>
            </div>

            <div class="nav-cell" id="cell-2" onclick="switchExhibit('CULT OBJECT . 02', 'Strawberry\nPoison Field', '달콤한 스트로베리 시럽 위에 뿌려진 스프링클. 입안에 퍼지는 상큼한 딸기의 산미와 오브제 본질의 조화.', 'POISON', './imgs/donut2.png', 2, this)">
                <div class="meta-info">
                    <span class="index-num">02 / PINK SHADE</span>
                    <span class="object-title">STRAWBERRY FIELD</span>
                </div>
                <div class="preview-circle">
                    <img src="./imgs/thumb2.png" alt="thumb2">
                </div>
            </div>

            <div class="nav-cell" id="cell-3" onclick="switchExhibit('CULT OBJECT . 03', 'Bavarian\nDeep Ash Brown', '부드러운 크림 슈가와 바삭한 에쉬 브라운 입자의 충돌. 무겁고 고요하게 가라앉는 깊은 풍미를 시각화합니다.', 'BAVARIAN', './imgs/donut3.png', 3, this)">
                <div class="meta-info">
                    <span class="index-num">03 / BROWN SHADE</span>
                    <span class="object-title">BAVARIAN FIELD</span>
                </div>
                <div class="preview-circle">
                    <img src="./imgs/thumb3.png" alt="thumb3">
                </div>
            </div>

        </div>

    </div>

    <script>
        function switchExhibit(meta, title, desc, bgText, imgPath, activeNum, element) {
            
            // 텍스트 컴포넌트 업데이트
            document.getElementById('target-meta').innerText = meta;
            document.getElementById('target-title').textContent = title; // pre-line 속성과 반응하도록 변경
            document.getElementById('target-desc').innerText = desc;
            
            // 배경 대형 텍스트 애니메이션 제어
            const bgTextEl = document.getElementById('target-bg-text');
            bgTextEl.style.opacity = '0';
            bgTextEl.style.transform = 'translateX(-20px)';
            
            setTimeout(() => {
                bgTextEl.innerText = bgText;
                bgTextEl.style.opacity = '0.04';
                bgTextEl.style.transform = 'translateX(0)';
            }, 150);

            // 메인 오브제 이미지 트랜지션 (쿠션감 있는 바운스 효과 추가)
            const mainImg = document.getElementById('target-img');
            mainImg.style.transform = 'scale(0.6) rotate(-12deg)';
            mainImg.style.opacity = '0';
            
            setTimeout(() => {
                mainImg.src = imgPath;
                mainImg.style.transform = 'scale(1) rotate(0deg)';
                mainImg.style.opacity = '1';
            }, 200);

            // 하단 탭 Active 클래스 교체 고도화
            const allCells = document.querySelectorAll('.nav-cell');
            allCells.forEach(cell => {
                cell.classList.remove('active-01', 'active-02', 'active-03');
            });

            if(activeNum === 1) element.classList.add('active-01');
            if(activeNum === 2) element.classList.add('active-02');
            if(activeNum === 3) element.classList.add('active-03');
        }
    </script>
</body>
</html>
