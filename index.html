<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNKIN' CONCEPTUAL ART / RE-DESIGN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Noto+Sans+KR:wght@300;400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111111; 
            color: #ffffff;
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        header .logo a {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.4em;
            color: #fff;
            text-decoration: none;
            letter-spacing: 3px;
        }

        header .logo a span {
            color: #E11383; 
        }

        header ul {
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.85em;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 60px;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.4s ease;
        }

        header ul li a:hover {
            color: #ffffff;
        }

        .main-container {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 60px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
        }

        .left-content {
            max-width: 600px;
        }

        .left-content .sub-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.9em;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        .left-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 5.5em;
            line-height: 1.1em;
            font-weight: 600;
            letter-spacing: -1px;
            color: #f5f5f5;
        }

        .left-content h1 span {
            display: block;
            font-family: 'Syncopate', sans-serif;
            font-style: normal;
            font-size: 0.45em;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            margin-top: 10px;
        }

        .left-content p {
            font-size: 0.95em;
            font-weight: 300;
            line-height: 1.8em;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 35px;
            word-break: keep-all;
        }

        .left-content .cta-btn {
            display: inline-block;
            margin-top: 45px;
            padding: 15px 45px;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8em;
            letter-spacing: 3px;
            text-decoration: none;
            background: transparent;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .left-content .cta-btn:hover {
            background-color: #ffffff;
            color: #111111;
            transform: translateY(-2px);
        }

        .right-visual {
            width: 650px;
            height: 550px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .visual-frame {
            position: absolute;
            width: 85%;
            height: 85%;
            background-color: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.6s ease;
            z-index: 1;
        }

        .right-visual img.main-product {
            max-width: 65%;
            height: auto;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.7));
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bottom-nav {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 40px 50px;
            display: flex;
            justify-content: flex-start;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .bottom-nav .nav-item {
            list-style: none;
            margin-right: 80px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .bottom-nav .nav-item .num {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            margin-bottom: 8px;
        }

        .bottom-nav .nav-item .title {
            font-size: 0.9em;
            font-weight: 400;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .bottom-nav .nav-item:hover .title,
        .bottom-nav .nav-item.active .title {
            color: #ffffff;
            font-weight: 700;
        }

        .social-links {
            position: absolute;
            bottom: 50%;
            right: 50px;
            transform: translateY(50%) rotate(90px);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .social-links a {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.65em;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            margin: 15px 0;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <header>
            <div class="logo"><a href="#">DNKN<span>.</span></a></div>
            <ul>
                <li><a href="#">ARCHIVE</a></li>
                <li><a href="#">MENU</a></li>
                <li><a href="#">SPACE</a></li>
                <li><a href="#">ABOUT</a></li>
            </ul>
        </header>

        <div class="main-container">
            
            <div class="left-content">
                <div class="sub-title">NEW FANTASY OF SWEETNESS</div>
                <h1 id="main-heading">Sweet<br>Delusion<span>NOIR GLAZED</span></h1>
                <p id="main-desc">기존의 달콤함을 해체하고 새로운 미각적 서사를 제시합니다. 던킨의 헤리티지와 미니멀리즘 아방가르드가 결합된 누아르 컬렉션을 경험해 보세요.</p>
                <a href="#" class="cta-btn">DISCOVER MORE</a>
            </div>

            <div class="right-visual">
                <div class="visual-frame" id="bg-frame"></div>
                <img src="./imgs/donut1.png" alt="Conceptual Donut" class="main-product" id="product-img">
            </div>

        </div>

        <ul class="bottom-nav">
            <li class="nav-item active" onclick="changeContent('01', 'Sweet<br>Delusion<span>NOIR GLAZED</span>', '기존의 달콤함을 해체하고 새로운 미각적 서사를 제시합니다. 던킨의 헤리티지와 미니멀리즘 아방가르드가 결합된 누아르 컬렉션을 경험해 보세요.', './imgs/donut1.png', '#1a1a1a', this)">
                <span class="num">01</span>
                <span class="title">NOIR GLAZED</span>
            </li>
            <li class="nav-item" onclick="changeContent('02', 'Bitter<br>Heart<span>BERRY POISON</span>', '선명한 이브닝 핑크 속에 감춰진 치명적인 새콤함. 정형화된 스트로베리 필드를 재해석한 예술적 피스입니다.', './imgs/donut2.png', '#2d1420', this)">
                <span class="num">02</span>
                <span class="title">BERRY POISON</span>
            </li>
            <li class="nav-item" onclick="changeContent('03', 'Silent<br>Velvet<span>BAVARIAN ASH</span>', '부드러운 크림과 거친 에쉬 옐로우 톤의 시각적 충돌. 입안 가득 퍼지는 고요하고 깊은 풍미를 남깁니다.', './imgs/donut3.png', '#2a261a', this)">
                <span class="num">03</span>
                <span class="title">BAVARIAN ASH</span>
            </li>
        </ul>

        <div class="social-links">
            <a href="#">INSTAGRAM</a>
            <a href="#">PINTEREST</a>
        </div>

    </div>

    <script>
        function changeContent(num, headingHtml, descText, imgPath, frameColor, element)
        {   document.getElementById('main-heading').innerHTML = headingHtml;
            document.getElementById('main-desc').innerText = descText;
            
            const productImg = document.getElementById('product-img');
            productImg.src = imgPath;
            productImg.style.transform = 'scale(0.8)';
            setTimeout(() => {
                productImg.style.transform = 'scale(1)';
            }, 50);
            document.getElementById('bg-frame').style.backgroundColor = frameColor;
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
