<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNKIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ubuntu', 'Noto Sans KR', sans-serif;
        }
        
        body {
            background-color: #fff;
            overflow-x: hidden;
        }
        section {
            position: relative;
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 0 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1400px;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        header .logo img {
            height: 45px; 
            display: block;
        }

        header ul {
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            display: inline-block;
            color: #333;
            font-weight: 700;
            margin-left: 50px;
            text-decoration: none;
            font-size: 1.1em;
            transition: 0.3s;
        }

        header ul li a:hover {
            color: #FF671F; 
        }

        .content { 
            position: relative;
            width: 100%;
            max-width: 1400px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .content .textBox {
            position: relative;
            max-width: 650px;
        }

        .content .textBox h2 {
            color: #222;
            font-size: 4em;
            line-height: 1.3em;
            font-weight: 700;
        }
        .content .textBox h2 span {
            color: #E11383; 
            font-size: 1.1em;
            font-weight: 900;
            display: block;
            margin-top: 5px;
        }

        .content .textBox p {
            color: #555;
            font-size: 1.1em;
            margin-top: 20px;
            line-height: 1.6em;
        }

        .content .textBox a {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 35px;
            background-color: #E11383;
            color: #fff;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(225, 19, 131, 0.3);
            transition: 0.3s;
        }

        .content .textBox a:hover {
            background-color: #FF671F;
            box-shadow: 0 4px 15px rgba(255, 103, 31, 0.4);
            transform: translateY(-3px);
        }

        .imgBox {
            width: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .imgBox img {
            max-width: 100%;
            height: auto;
            animation: float 4s ease-in-out infinite; /* 도넛이 둥둥 떠있는 듯한 고급 애니메이션 효과 추가 */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .thumb {
            position: absolute;
            display: flex;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .thumb li {
            list-style: none;
            margin: 0 20px;
            cursor: pointer;
            transition: .3s;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .thumb li:hover {
            transform: translateY(-10px) scale(1.1);
        }

        .thumb li img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .sci {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .sci li {
            list-style: none;
            margin: 12px 0;
        }
        
        .sci li a img {
            width: 28px;
            transition: 0.3s;
            opacity: 0.7;
        }

        .sci li a:hover img {
            opacity: 1;
            transform: scale(1.2);
        }
        .circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #E11383;
            clip-path: circle(650px at right 400px);
            transition: background 0.5s ease;
        }
    </style>
</head>
<body>
    <section>
        <div class="circle"></div> 
        
        <header>
            <a href="#" class="logo"><img src="./imgs/dunkin_logo.png" alt="DUNKIN Logo"></a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Store</a></li>
                <li><a href="#">Event</a></li>
            </ul>
        </header>
        
        <div class="content"> 
            <div class="textBox"> 
                <h2>Live Life<br>With <span>DUNKIN'</span></h2>
                <p>매일 아침 신선하게 구워내는 달콤한 도넛과<br>던킨만의 깊고 풍부한 시그니처 커피를 지금 만나보세요.</p>
                <a href="#">메뉴 보러가기</a>
            </div>
            <div class="imgBox">
                <img src="./imgs/donut1.png" alt="Dunkin Donut" class="dunkin">
            </div>
        </div>

        <ul class="thumb">
            <li><img src="./imgs/thumb1.png" alt="글레이즈드" onclick="imgSlider('./imgs/donut1.png'); changeCircleColor('#FF671F')"></li>
            <li><img src="./imgs/thumb2.png" alt="스트로베리" onclick="imgSlider('./imgs/donut2.png'); changeCircleColor('#E11383')"></li>
            <li><img src="./imgs/thumb3.png" alt="바바리안" onclick="imgSlider('./imgs/donut3.png'); changeCircleColor('#F4C430')"></li>
        </ul>

        <ul class="sci">
            <li><a href="#"><img src="./imgs/facebook.png" alt="페이스북"></a></li>
            <li><a href="#"><img src="./imgs/instagram.png" alt="인스타그램"></a></li>
            <li><a href="#"><img src="./imgs/blog.png" alt="블로그"></a></li>
        </ul>
    </section>

    <script>
        function imgSlider(anything){
            document.querySelector('.dunkin').src = anything;
        }
        function changeCircleColor(color){
            const circle = document.querySelector('.circle');
            circle.style.background = color;
        }
    </script>
</body>
</html>
